<div class="admin-dashboard">
  <h2>Admin Dashboard</h2>
  <p *ngIf="message" style="color:red">{{ message }}</p>

  <table border="1" cellpadding="10">
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Email</th>
      <th>Role</th>
      <th>Actions</th>
    </tr>

    <tr *ngFor="let user of users">
      <td>{{ user.id }}</td>
      <td>{{ user.username }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>
      <td>
        <button (click)="deleteUser(user.id)">Delete</button>
        <button *ngIf="user.role === 'USER'" (click)="promoteUser(user.id)">Promote</button>
      </td>
    </tr>
  </table>
</div>
